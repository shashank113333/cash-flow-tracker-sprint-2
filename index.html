<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash-Flow Tracker</title>
    <meta name="description" content="A simple Cash-Flow Tracker to manage your salary and daily expenses.">
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-100 font-sans text-gray-800 flex flex-col min-h-screen">

    <header class="bg-blue-600 text-white p-5 shadow-md">
        <nav class="max-w-4xl mx-auto">
            <h1 class="text-2xl font-bold text-center tracking-wide">Cash-Flow Tracker</h1>
        </nav>
    </header>

    <main class="flex-grow w-full max-w-2xl mx-auto bg-white p-6 my-8 rounded-lg shadow-lg border">
        <div id="error-msg" class="hidden mb-4 p-3 bg-red-100 text-red-700 rounded text-sm font-semibold"></div>
        <div id="warning-msg" class="hidden mb-4 p-3 bg-red-600 text-white rounded text-center font-bold animate-pulse">
             ⚠️ CRITICAL: Remaining balance has dropped below 10% of Total Salary!
        </div>

        <div class="mb-6 p-4 bg-gray-50 rounded border">
            <h2 class="font-semibold mb-2 text-gray-700">1. Set Total Salary</h2>
            <div class="flex gap-2">
                <input type="number" id="salary-input" placeholder="Enter Total Salary" class="border p-2 rounded flex-1 outline-none focus:border-blue-500">
                <button id="set-salary-btn" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">Set Salary</button>
            </div>
        </div>
        <div class="mb-6 p-4 bg-gray-50 rounded border">
            <h2 class="font-semibold mb-2 text-gray-700">2. Add Expense</h2>
            <div class="flex gap-2 mb-2">
                <input type="text" id="expense-name" placeholder="Expense Name (e.g. Rent)" class="border p-2 rounded flex-1 outline-none focus:border-red-500">
                <input type="number" id="expense-amount" placeholder="Amount" class="border p-2 rounded w-1/3 outline-none focus:border-red-500">
            </div>
            <button id="add-expense-btn" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 w-full transition font-semibold">Add Expense</button>
        </div>

        <div class="mb-6">
            <h3 class="font-semibold mb-3 border-b pb-2 text-gray-700">Summary Dashboard</h3>
            <div class="grid grid-cols-3 gap-4 text-center">
                <div class="bg-green-100 p-4 rounded shadow-sm border border-green-200">
                    <p class="text-xs text-gray-600 mb-1 uppercase tracking-wider font-semibold">Total Salary</p>
                    <p class="text-xl font-bold text-green-700" id="display-salary">₹0</p>
                </div>
                <div class="bg-red-100 p-4 rounded shadow-sm border border-red-200">
                    <p class="text-xs text-gray-600 mb-1 uppercase tracking-wider font-semibold">Total Expenses</p>
                    <p class="text-xl font-bold text-red-700" id="display-expenses">₹0</p>
                </div>
                <div class="bg-blue-100 p-4 rounded shadow-sm border border-blue-200">
                    <p class="text-xs text-gray-600 mb-1 uppercase tracking-wider font-semibold">Remaining Balance</p>
                    <p class="text-xl font-bold text-blue-700" id="display-balance">₹0</p>
                </div>
            </div>
        </div>

      
        <div>
            <h2 class="font-semibold mb-3 border-b pb-2 text-gray-700">Expense History</h2>
            <ul id="expense-list" class="space-y-3"></ul>
        </div>

    <div class="mb-6 p-4 bg-white rounded-lg shadow border text-center">
        <h3 class="font-semibold mb-2 text-gray-700">Financial Chart</h3>
    <div class="flex justify-center">

    <div style="width: 300px; height: 300px;">
        <canvas id="myChart"></canvas>
    </div>
    </div>
    </div>

    <div class="flex gap-4 mb-6">
        <button id="download-pdf-btn" class="bg-gray-800 text-white px-4 py-2 rounded flex-1 hover:bg-gray-900 shadow">

            📄 Download PDF Report
        </button>
        <button id="currency-btn" class="bg-yellow-500 text-white px-4 py-2 rounded flex-1 hover:bg-yellow-600 shadow">
            💵 Convert to USD
        </button>
    </div>
    </main>

    <footer class="bg-gray-800 text-white text-center p-4 text-sm mt-auto">
        <p>© 2026 Prodesk IT - Sprint 2 Deliverable</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
